{% extends "base.html" %}
{% block title %}Add a tea · Prolyv{% endblock %}
{% block content %}
<div class="container narrow">
  <p class="eyebrow">Tea base</p>
  <h1 class="h1">Add a tea</h1>
  <p class="lead">Know a tea we are missing? Fill in what you know; an admin checks it and publishes it to the base.</p>
  <form method="post" action="/teas/new" class="card form" novalidate>
    {% include "teas/_form_fields.html" %}
    <div class="actions"><button class="btn btn-primary" type="submit">Send for review</button><a class="btn btn-ghost" href="/teas">Cancel</a></div>
  </form>
</div>
{% endblock %}
