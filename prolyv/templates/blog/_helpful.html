{% set n = helpful_counts.get(c.id, 0) %}{% if current_user and c.user_id == current_user.id %}{% if n %}<span class="bp-helpful bp-helpful-own">{{ _("Helpful") }} · {{ n }}</span>{% endif %}{% elif current_user %}<form class="inline-form" method="post" action="{{ post_url }}/comments/{{ c.id }}/helpful" hx-post="{{ post_url }}/comments/{{ c.id }}/helpful" hx-target="this" hx-swap="outerHTML"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="bp-helpful" type="submit" aria-pressed="{{ 'true' if c.id in helpful_mine else 'false' }}">{{ _("Helpful") }}{% if n %} · {{ n }}{% endif %}</button></form>{% else %}<a class="bp-helpful" href="/login?next={{ (post_url ~ '#comments')|urlencode }}">{{ _("Helpful") }}{% if n %} · {{ n }}{% endif %}</a>{% endif %}
