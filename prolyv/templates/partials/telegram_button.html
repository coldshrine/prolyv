<button type="button" id="tg-login" class="btn-auth btn-telegram">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 4L3 11l6 2 2 6 3-4 5 4z"/><path d="M9 13l12-9"/></svg>
  {{ tg_label|default("Continue with Telegram") }}
</button>
<noscript><p class="muted small">Enable JavaScript to sign in with Telegram.</p></noscript>
<script src="https://telegram.org/js/telegram-widget.js?22" defer></script>
<script>
(function () {
  var cfg = { bot_id: "{{ settings.telegram_bot_id }}", request_access: "write" };
  function submit(user) {
    if (!user || !user.hash) return;
    var form = document.createElement("form");
    form.method = "POST";
    form.action = "/auth/telegram/callback";
    Object.keys(user).forEach(function (key) {
      var input = document.createElement("input");
      input.type = "hidden"; input.name = key; input.value = user[key];
      form.appendChild(input);
    });
    document.body.appendChild(form);
    form.submit();
  }
  function fullPageAuth() {
    location.href = Telegram.Login.widgetsOrigin + "/auth?bot_id=" + encodeURIComponent(cfg.bot_id)
      + "&origin=" + encodeURIComponent(location.origin) + "&request_access=write"
      + "&return_to=" + encodeURIComponent(location.href);
  }
  document.addEventListener("DOMContentLoaded", function () {
    var button = document.getElementById("tg-login");
    if (!window.Telegram || !Telegram.Login) {
      button.disabled = true;
      button.insertAdjacentHTML("afterend", '<p class="muted small">Telegram sign-in could not load. Check your connection and reload.</p>');
      return;
    }
    Telegram.Login.init(cfg, submit); // handles the return from a full-page sign-in (#tgAuthResult)
    button.addEventListener("click", function (event) {
      event.preventDefault();
      var realOpen = window.open, popup = null;
      window.open = function () { popup = realOpen.apply(window, arguments); return popup; };
      try { Telegram.Login.auth(cfg, submit); } finally { window.open = realOpen; }
      if (!popup) fullPageAuth(); // popups are blocked inside most in-app browsers
    });
  });
})();
</script>
