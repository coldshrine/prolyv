{% extends "base.html" %}
{% block title %}{% if post %}Edit post{% else %}New post{% endif %} · Prolyv admin{% endblock %}
{% block content %}
<div class="container narrow">
  <p class="eyebrow">Admin · <a href="/admin/posts">posts</a></p>
  <h1 class="h1">{% if post %}Edit: {{ post.title }}{% else %}New post{% endif %}</h1>
  <form method="post" action="{% if post %}/admin/posts/{{ post.id }}/edit{% else %}/admin/posts/new{% endif %}" class="card form" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label class="field"><span class="label">Title</span><input name="title" value="{{ form.title or '' }}" maxlength="160" required>{% if errors.title %}<span class="field-error">{{ errors.title }}</span>{% endif %}</label>
    <label class="field"><span class="label">Slug (optional, from the title when empty)</span><input name="slug" value="{{ form.slug or '' }}" maxlength="120" placeholder="shu-puerh-bitter-third-steep"></label>
    <label class="field"><span class="label">Summary (shown in the feed and in previews)</span><input name="summary" value="{{ form.summary or '' }}" maxlength="300"></label>
    <label class="field"><span class="label">Body (Markdown)</span><textarea name="body_md" rows="18" required placeholder="## Why this works&#10;&#10;Paragraphs, **bold**, lists, links, images: ![](https://…)">{{ form.body_md or '' }}</textarea>{% if errors.body_md %}<span class="field-error">{{ errors.body_md }}</span>{% endif %}</label>
    <label class="field"><span class="label">Video URL (TikTok or Instagram post/reel → embedded)</span><input name="video_url" value="{{ form.video_url or '' }}" placeholder="https://www.tiktok.com/@prolyv/video/…">{% if errors.video_url %}<span class="field-error">{{ errors.video_url }}</span>{% endif %}</label>
    <label class="field"><span class="label">Cover image URL</span><input name="cover_url" value="{{ form.cover_url or '' }}" placeholder="https://…/cover.jpg">{% if errors.cover_url %}<span class="field-error">{{ errors.cover_url }}</span>{% endif %}</label>
    <label class="field"><span class="label">Tea slug from the base (optional, enables brew-along prefill)</span><input name="tea_slug" value="{{ form.tea_slug or '' }}" placeholder="tie-guan-yin-qing-xiang"></label>
    <label class="check"><input type="checkbox" name="publish"{% if form.publish %} checked{% endif %}> Published (unchecked = draft, admins only)</label>
    <div class="actions"><button class="btn btn-primary" type="submit">{% if post %}Save post{% else %}Create post{% endif %}</button>{% if post %}<a class="btn btn-ghost" href="/blog/{{ post.slug }}">View</a>{% endif %}</div>
  </form>
</div>
{% endblock %}
