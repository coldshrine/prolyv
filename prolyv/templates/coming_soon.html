{% extends "base.html" %}
{% block title %}{{ title }} · Prolyv{% endblock %}
{% block content %}
<section class="container narrow centered">
  <p class="eyebrow">Coming soon</p>
  <h1 class="h1">{{ title }}</h1>
  <p class="lead">{{ text }}</p>
  <div class="actions">
    {% if current_user %}<a class="btn btn-secondary" href="/u/{{ current_user.handle }}">Your profile</a>{% else %}<a class="btn btn-primary" href="/login">Log in</a>{% endif %}
    <a class="btn btn-secondary" href="/">Home</a>
  </div>
</section>
{% endblock %}
