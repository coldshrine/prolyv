{% if teas %}<ul class="suggest-list">{% for t in teas %}<li><button type="button" class="suggest-item" data-id="{{ t.id }}" data-name="{{ t.name_en }}" data-grams="{{ t.brewing.grams or '' }}" data-water="{{ t.brewing.water_ml or '' }}" data-temp="{{ t.brewing.temp_c or '' }}" data-seconds="{{ t.brewing.seconds|join(',') if t.brewing.seconds else '' }}"><span class="cup-mark cup-{{ t.category.value }} cup-xs" aria-hidden="true"></span><span><strong>{{ t.name_en }}</strong><span class="muted small"> · {{ t.category_label }} · {{ t.origin_region or t.origin_country }}</span></span></button></li>{% endfor %}</ul>
{% elif q|length >= 2 %}<p class="muted small suggest-empty">Not in the base yet — your own name is fine, or <a href="/teas/new">add the tea</a>.</p>{% endif %}
