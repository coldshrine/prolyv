{% from "partials/macros.html" import cup %}
{% if teas %}<ul class="suggest-list">{% for t in teas %}{% set c = cup_styles(t.category.value, 240, t.liquor_hex, 1) %}<li><button type="button" class="suggest-item" data-id="{{ t.id }}" data-name="{{ t.name_en }}" data-sub="{{ t.category_label }} · {{ t.origin_region or t.origin_country }}" data-swirl="{{ c.swirl }}" data-core="{{ c.core }}" data-gloss="{{ c.gloss }}" data-shadow="{{ c.shadow }}" data-grams="{{ t.brewing.grams or '' }}" data-water="{{ t.brewing.water_ml or '' }}" data-temp="{{ t.brewing.temp_c or '' }}" data-seconds="{{ t.brewing.seconds|join(',') if t.brewing.seconds else '' }}">{{ cup(t.category.value, 28, t.liquor_hex) }}<span><strong>{{ t.name_en }}</strong><span class="muted small"> · {{ t.category_label }} · {{ t.origin_region or t.origin_country }}</span></span></button></li>{% endfor %}</ul>
{% elif q|length >= 2 %}<p class="muted small suggest-empty">Not in the base yet. Your own name for it is fine.</p>{% endif %}
