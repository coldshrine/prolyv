[project]
name = "prolyv"
version = "0.1.0"
description = "Prolyv — tea diary, forum and blog. Milestone 1: login and accounts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "authlib>=1.3",
    "httpx2>=2.0",
    "joserfc>=1.0",
    "itsdangerous>=2.2",
    "pydantic-settings>=2.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prolyv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning", "error::PendingDeprecationWarning"]
