<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Prolyv — app splash screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Unbounded:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
@keyframes prolyvSpin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){[data-spin]{animation:none!important}}
</style>
</helmet>
<div style="position: relative; overflow: hidden; width: 390px; height: 844px; box-sizing: border-box; padding: 0 32px 48px; display: flex; flex-direction: column; align-items: center; font-family: Manrope, system-ui, sans-serif; color: #FFFFFF; line-height: 1.5; background: radial-gradient(80% 40% at 50% 42%, rgba(255,79,216,0.45) 0, rgba(255,79,216,0) 70%), radial-gradient(70% 30% at 100% 100%, rgba(255,138,31,0.45) 0, rgba(255,138,31,0) 70%), radial-gradient(70% 30% at 0% 0%, rgba(37,99,255,0.45) 0, rgba(37,99,255,0) 70%), #070A2A">
<div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; text-align: center">
<dc-import name="Cup" kind="oolong" size="230" step="1" spin="on" hint-size="230px,230px"></dc-import>
<div>
<p style="margin: 0; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 34px; letter-spacing: -0.02em">Prolyv</p>
<p style="margin: 6px 0 0; font-size: 16px; color: #D7D9F2">Brewing your diary…</p>
</div>
</div>
<ol aria-label="Loading" style="list-style: none; margin: 0; padding: 0; display: flex; gap: 10px">
<sc-for list="{{dots}}" as="d" hint-placeholder-count="8">
<li style="width: 14px; height: 14px; border-radius: 50%; background: {{d.bg}}; box-shadow: {{d.glow}}"></li>
</sc-for>
</ol>
<p style="margin: 18px 0 0; font-size: 13px; color: #9EA3CF">A tea diary &amp; community</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const lit = ['#FF8A3D', '#FFA94F', '#FFC56E'];
    return {
      dots: [0, 1, 2, 3, 4, 5, 6, 7].map((i) => ({ bg: i < 3 ? lit[i] : 'rgba(255,255,255,0.16)', glow: i < 3 ? '0 0 12px ' + lit[i] : 'none' }))
    };
  }
}
</script>
</body>
</html>
