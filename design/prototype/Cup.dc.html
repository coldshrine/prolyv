<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Prolyv — cup (component)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: {{px}}; height: {{px}}; flex: none; border-radius: 50%; background: radial-gradient(circle at 38% 30%, #FFFFFF 0, #F1EBFF 50%, #C9BDF2 100%); box-shadow: {{shadow}}; font-family: Manrope, system-ui, sans-serif; color: #07081A">
<div style="position: absolute; inset: 7.9%; border-radius: 50%; background: #F8F4FF; box-shadow: {{rim}}"></div>
<div style="position: absolute; inset: 13.2%; border-radius: 50%; overflow: hidden">
<div data-spin="1" style="position: absolute; inset: 0; background: {{swirl}}; animation: {{anim}}">
<svg viewBox="0 0 100 100" style="position: absolute; inset: 0; width: 100%; height: 100%"><path d="M50 50 C 53.6 44.6, 60.7 44.6, 62.5 51.8 C 64.6 60.7, 53.6 67.9, 44.6 64.3 C 32.1 58.9, 33.9 41.1, 46.4 35.7 C 62.5 28.6, 78.6 41.1, 76.8 57.1 C 74.6 76.8, 51.8 83.9, 35.7 75" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.8" stroke-linecap="round"></path><path d="M53.6 53.6 C 57.1 51.8, 58.9 55.4, 56.8 57.5" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.1" stroke-linecap="round"></path></svg>
</div>
<div style="position: absolute; inset: 0; background: {{core}}"></div>
<div style="position: absolute; inset: 0; background: {{gloss}}"></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["oolong","red","shu","sheng","green","white","yellow"],"default":"oolong"},"size":{"editor":"int","default":320,"min":24,"max":1200},"step":{"editor":"int","default":2,"min":1,"max":8},"spin":{"editor":"enum","options":["on","off"],"default":"off"},"$preview":{"width":320,"height":320}}'>
class Component extends DCLogic {
  renderVals() {
    const P = {
      oolong: { stops: ['#FF8A1F', '#FF4B3E', '#FF4FD8', '#FFB347', '#FFC21A', '#FF8A1F'], core: '#FFC21A', edge: 'rgba(110,20,10,0.38)', glow: '#FF4FD8' },
      red: { stops: ['#FF4B3E', '#C4161C', '#FF4FD8', '#FF7A6B', '#FF8A1F', '#FF4B3E'], core: '#FF8A1F', edge: 'rgba(90,0,10,0.45)', glow: '#FF4B3E' },
      shu: { stops: ['#6A1FD0', '#3A0E8C', '#FF4FD8', '#A86BFF', '#2563FF', '#6A1FD0'], core: '#A86BFF', edge: 'rgba(20,0,40,0.55)', glow: '#8A3FFC' },
      sheng: { stops: ['#D6F25C', '#8FAE12', '#FFE066', '#22E3A6', '#B8E23A', '#D6F25C'], core: '#FFF1A8', edge: 'rgba(40,60,0,0.38)', glow: '#B8E23A' },
      green: { stops: ['#22E3A6', '#0E9E73', '#D6F25C', '#5CF2B8', '#22B8FF', '#22E3A6'], core: '#D6F25C', edge: 'rgba(0,60,40,0.35)', glow: '#22E3A6' },
      white: { stops: ['#F4EEFF', '#C7B8FF', '#FFD3F4', '#E9DFFF', '#FFE9B8', '#F4EEFF'], core: '#FFFFFF', edge: 'rgba(80,60,140,0.3)', glow: '#C77DFF' },
      yellow: { stops: ['#FFE066', '#E8A100', '#FFB347', '#FFF1A8', '#D6F25C', '#FFE066'], core: '#FFF1A8', edge: 'rgba(120,70,0,0.35)', glow: '#FFC21A' }
    };
    const kind = P[this.props.kind] ? this.props.kind : 'oolong';
    const p = P[kind];
    const size = parseInt(this.props.size, 10) || 320;
    const step = Math.min(8, Math.max(1, parseInt(this.props.step, 10) || 2));
    const t = (step - 1) / 12;
    const pale = [255, 243, 220];
    const mix = (hex) => {
      const n = parseInt(hex.slice(1), 16);
      const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v, i) => Math.round(v + (pale[i] - v) * t));
      return '#' + c.map((v) => v.toString(16).padStart(2, '0')).join('');
    };
    return {
      px: size + 'px',
      swirl: 'conic-gradient(from 140deg at 50% 50%, ' + p.stops.map(mix).join(', ') + ')',
      core: 'radial-gradient(circle at 50% 50%, ' + mix(p.core) + ' 0, rgba(255,255,255,0) 46%)',
      gloss: 'radial-gradient(circle at 36% 28%, rgba(255,255,255,0.7) 0, rgba(255,255,255,0) 16%), radial-gradient(circle at 50% 50%, rgba(0,0,0,0) 60%, ' + p.edge + ' 100%)',
      shadow: '0 ' + Math.round(size * 0.09) + 'px ' + Math.round(size * 0.18) + 'px -' + Math.round(size * 0.05) + 'px ' + p.glow + 'AA',
      rim: 'inset 0 ' + Math.max(2, Math.round(size * 0.024)) + 'px ' + Math.max(4, Math.round(size * 0.055)) + 'px rgba(60,30,120,0.25)',
      anim: String(this.props.spin) === 'on' ? 'prolyvSpin 24s linear infinite' : 'none'
    };
  }
}
</script>
</body>
</html>
